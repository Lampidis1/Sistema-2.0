<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RCA · Cumplimiento · Sistema AM</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.7"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="../../config/supabase.config.js"></script>
<link rel="stylesheet" href="rca.css?v=20260819f">
<link rel="stylesheet" href="../../shared/css/responsive.css?v=20260808f">
</head>
<body>

<!-- ░░ GATE ░░ -->
<div id="gate">
  <div class="gate-card">
    <img src="../../shared/assets/logo-amsa-873.png" alt="AM">
    <div class="gate-t">RCA · Cumplimiento</div>
    <div class="gate-s">Acceso restringido</div>
    <div id="gateErr" class="gate-err"></div>
    <div id="loginStep">
      <label>Correo</label>
      <input id="lgEmail" type="email" placeholder="usuario@empresa.cl" autocomplete="username">
      <label>Contraseña</label>
      <input id="lgPass" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrar()">
      <button class="gate-btn" id="lgBtn" onclick="entrar()">Ingresar</button>
      <div style="margin-top:14px;font-size:.8rem">¿Sin cuenta? <span class="gate-link" onclick="verRegistro()">Solicitar acceso</span></div>
    </div>
    <div id="regStep" style="display:none">
      <div class="grid2">
        <div><label>Nombre</label><input id="rgNombre" placeholder="Nombre"></div>
        <div><label>Apellido</label><input id="rgApellido" placeholder="Apellido"></div>
      </div>
      <label>Correo</label>
      <input id="rgEmail" type="email" placeholder="usuario@empresa.cl">
      <label>Contraseña (mín. 6)</label>
      <input id="rgPass" type="password" placeholder="••••••••">
      <button class="gate-btn" id="rgBtn" onclick="registrarse()">Solicitar acceso</button>
      <div style="margin-top:14px;font-size:.8rem"><span class="gate-link" onclick="verLogin()">← Volver al inicio de sesión</span></div>
    </div>
    <div id="pendStep" style="display:none">
      <div style="font-size:2.4rem;margin-bottom:8px">⏳</div>
      <div style="font-weight:700;margin-bottom:6px">Cuenta pendiente de aprobación</div>
      <div style="font-size:.84rem;color:var(--text-muted)">Un administrador debe habilitar tu acceso a RCA. Vuelve a intentar más tarde.</div>
      <button class="gate-btn" style="margin-top:16px" onclick="salir()">Cerrar sesión</button>
    </div>
  </div>
</div>

<!-- ░░ APP ░░ -->
<div id="app" class="hidden">
  <header>
    <img src="../../shared/assets/logo-amsa-873.png" alt="AM">
    <div class="h-sep"></div>
    <div>
      <div class="h-title">RCA · Cumplimiento</div>
      <div class="h-sub">Compromisos ambientales · Antofagasta Minerals</div>
    </div>
    <div class="h-right">
      <span class="h-user" id="hUser"></span>
      <a class="h-home" href="../../index.html">⌂ Inicio</a>
      <button class="h-out" onclick="salir()">Salir</button>
    </div>
  </header>

  <main id="rcaMain">
    <!-- Lista de RCA -->
    <section id="vistaLista"></section>
    <!-- Detalle de una RCA -->
    <section id="vistaDetalle" class="hidden"></section>
  </main>
</div>

<!-- host de modales y toast -->
<div id="modalHost"></div>
<div class="toast" id="toast"></div>
<input type="file" id="rcaFile" accept=".xlsx,.xls,.csv" style="display:none" onchange="rcaFileElegido(this)">

<script>window.AUTH_CFG = {
  storageKey: 'am_rca_auth',
  slug: 'rca',
  altSlugs: ['principal'],
  origen: 'rca',
  rolSolicitado: 'usuario',
  faenaSolicitada: 'rca',
  msgPassCorta: 'La contraseña debe tener al menos 6 caracteres',
  onRegistroOk: function(){ setTimeout(()=>alert('Tu cuenta fue creada y está PENDIENTE de aprobación. Cuando un administrador te habilite el acceso a RCA, podrás ingresar.'),200); },
  onAcceso: function(user){ return rcaOnAcceso(user); }
};</script>
<script src="../../shared/js/auth-guard.js"></script>
<script src="rca.js?v=20260819f"></script>
</body>
</html>
