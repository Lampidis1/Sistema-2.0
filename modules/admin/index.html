<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de usuarios · Sistema AM</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.7"></script>
<script src="../../config/supabase.config.js"></script>
<link rel="stylesheet" href="admin.css">
<!-- Ajustes de tableta y telefono comunes a todo el sistema (shared/).
     Va SIEMPRE AL FINAL: algunas reglas deben ganarle al CSS del modulo. -->
<link rel="stylesheet" href="../../shared/css/responsive.css?v=20260808f">
</head>
<body>
<!-- GATE -->
<div id="gate">
  <div class="gate-card">
    <img src="../../shared/assets/logo-amsa-873.png" alt="AM">
    <div class="gate-t">Gestión de usuarios</div>
    <div class="gate-s">Solo administradores</div>
    <div id="gateErr" class="gate-err"></div>
    <div id="loginStep">
      <label>Correo</label>
      <input id="lgEmail" type="email" inputmode="email" placeholder="usuario@aminerals.cl" autocomplete="username">
      <label>Contraseña</label>
      <input id="lgPass" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrar()">
      <button class="gate-btn" id="lgBtn" onclick="entrar()">Ingresar</button>
    </div>
    <div id="regStep" style="display:none"></div>
    <div id="pendStep" style="display:none">
      <div style="font-size:2.2rem">⛔</div>
      <div style="font-weight:700;margin:6px 0">Acceso restringido</div>
      <div style="font-size:.82rem;color:var(--text-muted)">Esta sección es solo para administradores.</div>
      <button class="gate-btn" style="margin-top:14px" onclick="salir()">Cerrar sesión</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header>
    <div>
      <div class="ht">Gestión de usuarios</div>
      <div class="hs">Sistema AM</div>
    </div>
    <div class="sp">
      <span id="hUser" style="font-size:.72rem;opacity:.9"></span>
      <a href="../../index.html">⌂</a>
      <button onclick="salir()">Salir</button>
    </div>
  </header>
  <main>
    <div style="background:#fff;border-radius:14px;border:1px solid var(--border);padding:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:10px">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:1.4rem;font-weight:800;color:var(--primary);text-transform:uppercase">👤 Solicitudes de acceso</div>
        <button class="kb-add" onclick="renderUsuarios()">↻ Actualizar</button>
      </div>
      <div style="font-size:.83rem;color:var(--text-muted);margin-bottom:16px">Aprueba o rechaza las solicitudes de acceso. Los pendientes no ven ningún dato hasta que los apruebes.</div>
      <div id="usuariosContent"><div class="kb-empty">Cargando…</div></div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>window.AUTH_CFG = {
  storageKey: 'am_admin_auth',
  adminOnly: true,
  onAcceso: function(user){ return _adminOnAcceso(user); }
};</script>
<script src="../../shared/js/auth-guard.js"></script>
<script src="admin.js"></script>
</body>
</html>
