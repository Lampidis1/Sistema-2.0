<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reclamos Comunitarios · Antofagasta Minerals</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.7"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="../../config/supabase.config.js"></script>
<link rel="stylesheet" href="reclamos.css?v=20260930c">
<!-- Ajustes de tableta y teléfono comunes a todo el sistema. Va al final. -->
<link rel="stylesheet" href="../../shared/css/responsive.css?v=20260808f">
</head>
<body>

<!-- ════════ GATE (login / registro / pendiente) ════════ -->
<div id="gate">
  <div class="gate-card">
    <img src="../../shared/assets/logo-amsa-873.png" alt="Antofagasta Minerals">
    <div class="gate-t">Reclamos Comunitarios</div>
    <div class="gate-s">Informe semanal de reclamos · AAPP</div>
    <div id="gateErr" class="gate-err"></div>
    <div id="loginStep">
      <label>Correo</label>
      <input id="lgEmail" type="email" inputmode="email" placeholder="usuario@aminerals.cl" autocomplete="username">
      <label>Contraseña</label>
      <input id="lgPass" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrar()">
      <button class="gate-btn" id="lgBtn" onclick="entrar()">Ingresar</button>
      <div style="margin-top:14px;font-size:.82rem">¿Sin cuenta? <span class="gate-link" onclick="verRegistro()">Solicitar acceso</span></div>
    </div>
    <div id="regStep" style="display:none">
      <div class="g2"><div><label>Nombre</label><input id="rgNombre"></div><div><label>Apellido</label><input id="rgApellido"></div></div>
      <label>Correo</label><input id="rgEmail" type="email" inputmode="email">
      <label>Contraseña (mín. 6)</label><input id="rgPass" type="password">
      <button class="gate-btn" id="rgBtn" onclick="registrarse()">Solicitar acceso</button>
      <div style="margin-top:12px;font-size:.82rem"><span class="gate-link" onclick="verLogin()">← Volver</span></div>
    </div>
    <div id="pendStep" style="display:none">
      <div style="font-size:2.2rem">⏳</div>
      <div style="font-weight:700;margin:6px 0">Cuenta pendiente</div>
      <div style="font-size:.82rem;color:var(--gray)">Un administrador debe habilitar tu acceso a Reclamos Comunitarios.</div>
      <button class="gate-btn" style="margin-top:14px" onclick="salir()">Cerrar sesión</button>
    </div>
  </div>
</div>

<!-- ════════ APP ════════ -->
<div id="app" class="hidden">
  <header class="top">
    <div class="top-in">
      <div>
        <h1>Reclamos Comunitarios</h1>
        <div class="sub" id="subCtx">Informe semanal · AAPP Norte</div>
      </div>
      <div class="sp">
        <span id="hUser"></span>
        <a href="../../index.html" title="Inicio">⌂</a>
        <button onclick="salir()">Salir</button>
      </div>
    </div>
  </header>
  <div class="ribbon"></div>

  <nav class="vistas">
    <button class="vista-tab active" id="tabNorte" onclick="recVista('norte')">AAPP Norte</button>
    <button class="vista-tab" id="tabMlp" onclick="recVista('mlp')">MLP</button>
  </nav>

  <main class="wrap" id="vistaContenido">
    <!-- lo pinta reclamos.js -->
  </main>
</div>

<!-- Modal genérico (candado, histórico, ver informe) -->
<div id="modalMask" class="modal-mask hidden" onclick="if(event.target===this)cerrarModal()">
  <div class="modal" id="modalBox"></div>
</div>

<div id="toast"></div>

<!-- Config del guard de autenticación (antes de auth-guard.js). -->
<script>
  window.AUTH_CFG = {
    storageKey: 'am_recl_auth',
    slug: 'reclamos',
    altSlugs: ['principal'],          // el equipo de Proveedores también lo opera
    origen: 'reclamos',
    rolSolicitado: 'usuario',
    faenaSolicitada: 'reclamos',
    msgPassCorta: 'Mínimo 6 caracteres',
    onAcceso: function(user){ return reclamosAcceso(user); }
  };
</script>
<script src="../../shared/js/auth-guard.js?v=20260929"></script>
<script src="reclamos-imagen.js?v=20260930b"></script>
<script src="reclamos.js?v=20260930c"></script>
</body>
</html>
