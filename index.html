<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema AM · Antofagasta Minerals</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#006973 0%,#00A399 60%,#00857a 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{background:#fff;border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.35);width:100%;max-width:520px;padding:44px 40px;text-align:center}
  .logo{height:66px;margin-bottom:8px}
  h1{font-family:'Barlow Condensed',sans-serif;font-size:1.9rem;font-weight:800;color:#006973;letter-spacing:.03em;text-transform:uppercase;line-height:1;margin-top:14px}
  .sub{color:#5F6973;font-size:.82rem;margin:6px 0 32px;letter-spacing:.06em;text-transform:uppercase}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:520px){.cards{grid-template-columns:1fr}h1{font-size:1.6rem}}
  .card{background:#f7fafa;border:2px solid #e4eef0;border-radius:14px;padding:26px 18px;text-decoration:none;color:inherit;transition:.16s;display:block}
  .card:hover{transform:translateY(-4px);border-color:#F2A900;box-shadow:0 14px 34px rgba(0,0,0,.14)}
  .ic{font-size:2.6rem;margin-bottom:10px}
  .ct{font-family:'Barlow Condensed',sans-serif;font-size:1.35rem;font-weight:800;color:#006973;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
  .cd{font-size:.8rem;color:#5F6973;line-height:1.45}
  .foot{margin-top:28px;color:#98a4ac;font-size:.72rem;letter-spacing:.04em}
  .badge{display:inline-block;background:#E4F6F5;color:#006973;border-radius:20px;padding:4px 14px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-top:18px}
</style>
</head>
<body>
  <div class="box">
    <img src="shared/assets/logo-amsa-600.png" alt="Antofagasta Minerals" class="logo">
    <h1>Sistema AM</h1>
    <div class="sub">Relaciones Comunitarias</div>
    <!-- Las tarjetas las genera config/modules.config.js. No editar acá. -->
    <div class="cards" id="cards"></div>
    <div class="badge">🔒 Acceso restringido</div>
    <div class="foot">Cada plataforma solicita inicio de sesión · v2.0</div>
  </div>
<script src="config/modules.config.js"></script>
<script>
// El Home no conoce ningun modulo: solo pinta lo que declara modules.config.js.
(function () {
  var cont = document.getElementById('cards');
  var mods = (window.AM_MODULES || []).filter(function (m) { return m.visibleEnHome; });

  // ── P-3 (docs/PENDIENTES.md) ────────────────────────────────────────────
  // Si ya existe una sesion guardada de ALGUN modulo, se usa para OCULTAR
  // tarjetas a las que esa sesion no tiene acceso. Sin sesion en ningun
  // lado (visitante nuevo), se muestran todas igual que siempre -- esto
  // nunca REVELA una tarjeta que hoy esta oculta por visibleEnHome:false.
  //
  // Sin red, sin cargar Supabase: cada modulo guarda su sesion en
  // localStorage bajo su propia storageKey (no hay "la sesion" unica), asi
  // que se leen directo y se decodifica el JWT a mano, igual que ya hacen
  // los modulos entre si.
  var STORAGE_KEYS = ['am_v2_auth', 'am_emp_auth', 'am_mov_auth', 'am_mgi',
    'am_pub_centinela', 'am_pub_antucoya', 'am_pub_zaldivar', 'am_admin_auth'];

  function decodeJwt(token) {
    try {
      var b = token.split('.')[1];
      return JSON.parse(atob(b.replace(/-/g, '+').replace(/_/g, '/')));
    } catch (e) { return null; }
  }

  function leerSesion() {
    for (var i = 0; i < STORAGE_KEYS.length; i++) {
      try {
        var raw = localStorage.getItem(STORAGE_KEYS[i]);
        if (!raw) continue;
        var token = (JSON.parse(raw) || {}).access_token;
        if (!token) continue;
        var payload = decodeJwt(token);
        if (!payload || !payload.exp || payload.exp * 1000 < Date.now()) continue;
        var md = payload.app_metadata || {};
        return { rol: md.rol || '', estado: md.estado || '', accesos: Array.isArray(md.accesos) ? md.accesos : [] };
      } catch (e) { /* clave con formato inesperado: seguir probando las demas */ }
    }
    return null; // sin sesion valida en ningun modulo
  }

  function tieneAcceso(m, sesion) {
    if (!sesion) return true; // sin sesion: no se oculta nada
    if (sesion.rol === 'admin') return true;
    if (sesion.estado !== 'aprobado') return false;
    var alt = m.accesoAlterno ? [].concat(m.accesoAlterno) : [];
    var slugs = [m.acceso].concat(alt);
    for (var i = 0; i < slugs.length; i++) {
      if (sesion.accesos.indexOf(slugs[i]) !== -1) return true;
    }
    return false;
  }

  var sesion = leerSesion();
  mods = mods.filter(function (m) { return tieneAcceso(m, sesion); });

  function esc(t) {
    return String(t).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  cont.innerHTML = mods.map(function (m) {
    var prox = m.estado === 'proximamente';
    return '<a class="card" href="' + (prox ? '#' : esc(m.ruta)) + '"' +
           (prox ? ' style="opacity:.55;cursor:default" onclick="return false"' : '') + '>' +
           '<div class="ic">' + esc(m.icono) + '</div>' +
           '<div class="ct">' + esc(m.nombre) + (prox ? ' · Próximamente' : '') + '</div>' +
           '<div class="cd">' + esc(m.descripcion) + '</div>' +
           '</a>';
  }).join('');
})();
</script>
</body>
</html>
