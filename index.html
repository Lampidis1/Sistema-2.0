<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema AM · Antofagasta Minerals</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#006973 0%,#00A399 60%,#00857a 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{background:#fff;border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.35);width:100%;max-width:720px;padding:40px 36px}
  .head{text-align:center;margin-bottom:8px}
  .logo{height:60px;margin-bottom:8px}
  h1{font-family:'Barlow Condensed',sans-serif;font-size:1.8rem;font-weight:800;color:#006973;letter-spacing:.03em;text-transform:uppercase;line-height:1;margin-top:12px}
  .sub{color:#5F6973;font-size:.8rem;margin:6px 0 30px;letter-spacing:.06em;text-transform:uppercase}

  /* Nivel 1 — "principal": el par grande, usa el espacio de forma notoria */
  .cards-principal{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:480px){.cards-principal{grid-template-columns:1fr}}
  .card-principal{background:#f7fafa;border:2px solid #e4eef0;border-radius:16px;padding:0;text-decoration:none;color:inherit;transition:.16s;display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:1/1;text-align:center}
  .card-principal:hover{transform:translateY(-4px);border-color:#F2A900;box-shadow:0 14px 34px rgba(0,0,0,.14)}
  .card-principal .ic{font-size:3.4rem;margin-bottom:12px}
  .card-principal .ct{font-family:'Barlow Condensed',sans-serif;font-size:1.4rem;font-weight:800;color:#006973;text-transform:uppercase;letter-spacing:.02em;margin-bottom:6px}
  .card-principal .cd{font-size:.76rem;color:#5F6973;line-height:1.45;padding:0 18px}

  /* Nivel 2 — "medio": tamaño normal, en el orden del config */
  .cards-medio{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:560px){.cards-medio{grid-template-columns:repeat(2,1fr)}}
  .card-medio{background:#f7fafa;border:2px solid #e4eef0;border-radius:14px;padding:20px 12px;text-decoration:none;color:inherit;transition:.16s;display:block;text-align:center}
  .card-medio:hover{transform:translateY(-4px);border-color:#F2A900;box-shadow:0 14px 34px rgba(0,0,0,.14)}
  .card-medio .ic{font-size:2.2rem;margin-bottom:8px}
  .card-medio .ic-img{height:2.1rem;width:auto}
  .card-medio .ct{font-family:'Barlow Condensed',sans-serif;font-size:1.05rem;font-weight:800;color:#006973;text-transform:uppercase;letter-spacing:.02em;margin-bottom:3px}
  .card-medio .cd{font-size:.72rem;color:#5F6973;line-height:1.4}

  .divider{display:flex;align-items:center;gap:10px;margin:28px 0 16px;color:#98a4ac;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:#e4eef0}

  /* Nivel 3 — "el resto": chico, al final */
  .cards-chico{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:560px){.cards-chico{grid-template-columns:repeat(3,1fr)}}
  .card-chico{background:#fff;border:1.5px solid #e4eef0;border-radius:11px;padding:12px 8px;text-decoration:none;color:inherit;transition:.16s;display:block;text-align:center}
  .card-chico:hover{border-color:#F2A900;background:#fffaf0}
  .card-chico .ic{font-size:1.5rem;margin-bottom:4px}
  .card-chico .ct{font-size:.68rem;font-weight:700;letter-spacing:0}

  .foot-row{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:30px;flex-wrap:wrap}
  .badge{display:inline-block;background:#E4F6F5;color:#006973;border-radius:20px;padding:4px 14px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
  .foot{color:#98a4ac;font-size:.72rem;letter-spacing:.04em;text-align:center;margin-top:10px}
  .empty{grid-column:1/-1;color:#98a4ac;font-size:.8rem;text-align:center;padding:10px;font-style:italic}
</style>
</head>
<body>
  <div class="box">
    <div class="head">
      <img src="shared/assets/logo-amsa-600.png" alt="Antofagasta Minerals" class="logo">
      <h1>Sistema AM</h1>
      <div class="sub">Relaciones Comunitarias</div>
    </div>
    <!-- Las tarjetas las genera config/modules.config.js. No editar acá. -->
    <div class="cards-principal" id="cardsPrincipal"></div>
    <div class="divider" id="divMedio" style="display:none">Módulos</div>
    <div class="cards-medio" id="cardsMedio"></div>
    <div class="divider" id="divChico" style="display:none">Más módulos</div>
    <div class="cards-chico" id="cardsChico"></div>
    <div class="foot-row">
      <div class="badge">🔒 Acceso restringido</div>
    </div>
    <div class="foot">Cada plataforma solicita inicio de sesión · v2.0</div>
  </div>
<!-- ?v= : obliga al navegador a bajar el config nuevo tras un despliegue en
     vez de servir su copia guardada. Subir el número al editar el config. -->
<script src="config/modules.config.js?v=20260808"></script>
<script>
// El Home no conoce ningun modulo: solo pinta lo que declara modules.config.js.
(function () {
  var contPrincipal = document.getElementById('cardsPrincipal');
  var contMedio = document.getElementById('cardsMedio');
  var contChico = document.getElementById('cardsChico');
  var mods = (window.AM_MODULES || []).filter(function (m) { return m.visibleEnHome; });

  // ── P-3 (docs/PENDIENTES.md) ────────────────────────────────────────────
  // Si ya existe una sesion guardada de ALGUN modulo, se usa para OCULTAR
  // tarjetas a las que esa sesion no tiene acceso. Sin sesion en ningun
  // lado (visitante nuevo), se muestran todas igual que siempre -- esto
  // nunca REVELA una tarjeta que hoy esta oculta por visibleEnHome:false.
  //
  // Sin red, sin cargar Supabase: cada modulo guarda su sesion en
  // localStorage bajo su propia storageKey (no hay "la sesion" unica), asi
  // que se leen directo y se decodifica el JWT a mano, igual que ya hacen
  // los modulos entre si.
  var STORAGE_KEYS = ['am_v2_auth', 'am_emp_auth', 'am_mov_auth', 'am_mgi',
    'am_pub_centinela', 'am_pub_antucoya', 'am_pub_zaldivar', 'am_admin_auth', 'am_planer_auth'];

  function decodeJwt(token) {
    try {
      var b = token.split('.')[1];
      return JSON.parse(atob(b.replace(/-/g, '+').replace(/_/g, '/')));
    } catch (e) { return null; }
  }

  function leerSesion() {
    for (var i = 0; i < STORAGE_KEYS.length; i++) {
      try {
        var raw = localStorage.getItem(STORAGE_KEYS[i]);
        if (!raw) continue;
        var token = (JSON.parse(raw) || {}).access_token;
        if (!token) continue;
        var payload = decodeJwt(token);
        if (!payload || !payload.exp || payload.exp * 1000 < Date.now()) continue;
        var md = payload.app_metadata || {};
        return { rol: md.rol || '', estado: md.estado || '', accesos: Array.isArray(md.accesos) ? md.accesos : [] };
      } catch (e) { /* clave con formato inesperado: seguir probando las demas */ }
    }
    return null; // sin sesion valida en ningun modulo
  }

  function tieneAcceso(m, sesion) {
    if (!sesion) return true; // sin sesion: no se oculta nada
    if (sesion.rol === 'admin') return true;
    if (sesion.estado !== 'aprobado') return false;
    var alt = m.accesoAlterno ? [].concat(m.accesoAlterno) : [];
    var slugs = [m.acceso].concat(alt);
    for (var i = 0; i < slugs.length; i++) {
      if (sesion.accesos.indexOf(slugs[i]) !== -1) return true;
    }
    return false;
  }

  var sesion = leerSesion();
  mods = mods.filter(function (m) { return tieneAcceso(m, sesion); });

  function esc(t) {
    return String(t).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function tarjeta(m, clase, conDescripcion) {
    var prox = m.estado === 'proximamente';
    var esImg = /\.png$/i.test(m.icono || '');
    var ic = esImg
      ? '<img src="' + esc(m.icono) + '" alt="" class="ic-img">'
      : esc(m.icono);
    return '<a class="' + clase + '" href="' + (prox ? '#' : esc(m.ruta)) + '"' +
           (prox ? ' style="opacity:.55;cursor:default" onclick="return false"' : '') + '>' +
           '<div class="ic">' + ic + '</div>' +
           '<div class="ct">' + (m.nombre ? esc(m.nombre) + (prox ? ' · Próximamente' : '') : (prox ? 'Próximamente' : '')) + '</div>' +
           (conDescripcion ? '<div class="cd">' + esc(m.descripcion) + '</div>' : '') +
           '</a>';
  }

  // Tres niveles, en el orden en que aparecen en modules.config.js dentro de
  // cada nivel (ver comentario `homeTier` ahí).
  var principal = mods.filter(function (m) { return m.homeTier === 'principal'; });
  var medio     = mods.filter(function (m) { return m.homeTier === 'medio'; });
  var chico     = mods.filter(function (m) { return !m.homeTier; });

  contPrincipal.innerHTML = principal.map(function (m) { return tarjeta(m, 'card-principal', true); }).join('')
    || '<div class="empty">Sin accesos para esta sesión.</div>';

  if (medio.length) {
    document.getElementById('divMedio').style.display = 'flex';
    contMedio.innerHTML = medio.map(function (m) { return tarjeta(m, 'card-medio', true); }).join('');
  }

  if (chico.length) {
    document.getElementById('divChico').style.display = 'flex';
    contChico.innerHTML = chico.map(function (m) { return tarjeta(m, 'card-chico', false); }).join('');
  }
})();
</script>
</body>
</html>
