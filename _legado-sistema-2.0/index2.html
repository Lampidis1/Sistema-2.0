<title>Sistema AM · Antofagasta Minerals</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#006973 0%,#00A399 60%,#00857a 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{background:#fff;border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.35);width:100%;max-width:520px;padding:44px 40px;text-align:center}
  .logo{height:66px;margin-bottom:8px}
  h1{font-family:'Barlow Condensed',sans-serif;font-size:1.9rem;font-weight:800;color:#006973;letter-spacing:.03em;text-transform:uppercase;line-height:1;margin-top:14px}
  .sub{color:#5F6973;font-size:.82rem;margin:6px 0 32px;letter-spacing:.06em;text-transform:uppercase}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:520px){.cards{grid-template-columns:1fr}h1{font-size:1.6rem}}
  .card{background:#f7fafa;border:2px solid #e4eef0;border-radius:14px;padding:26px 18px;text-decoration:none;color:inherit;transition:.16s;display:block}
  .card:hover{transform:translateY(-4px);border-color:#F2A900;box-shadow:0 14px 34px rgba(0,0,0,.14)}
  .ic{font-size:2.6rem;margin-bottom:10px}
  .ct{font-family:'Barlow Condensed',sans-serif;font-size:1.35rem;font-weight:800;color:#006973;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
  .cd{font-size:.8rem;color:#5F6973;line-height:1.45}
  .foot{margin-top:28px;color:#98a4ac;font-size:.72rem;letter-spacing:.04em}
  .badge{display:inline-block;background:#E4F6F5;color:#006973;border-radius:20px;padding:4px 14px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-top:18px}
</style>
