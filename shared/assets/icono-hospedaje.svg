<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hospedajes">
  <!-- Icono de hospedajes: casita con H y estrellas de categoría.
       Colores del sistema: teal AMSA (#006973 / #00A399) y dorado (#F2A900). -->
  <defs>
    <linearGradient id="techo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00A399"/>
      <stop offset="1" stop-color="#006973"/>
    </linearGradient>
  </defs>

  <!-- estrellas de categoría -->
  <g fill="#F2A900">
    <path d="M13 11.6l1.32 2.68 2.96.43-2.14 2.09.5 2.95L13 18.35l-2.64 1.4.5-2.95-2.14-2.09 2.96-.43z"/>
    <path d="M32 8.4l1.55 3.14 3.47.5-2.51 2.45.59 3.46L32 15.32l-3.1 1.63.59-3.46-2.51-2.45 3.47-.5z"/>
    <path d="M51 11.6l1.32 2.68 2.96.43-2.14 2.09.5 2.95L51 18.35l-2.64 1.4.5-2.95-2.14-2.09 2.96-.43z"/>
  </g>

  <!-- techo -->
  <path d="M32 23.5L57 39.5v2.2a2 2 0 0 1-3.1 1.67L32 28.9 10.1 43.37A2 2 0 0 1 7 41.7v-2.2z" fill="url(#techo)"/>

  <!-- cuerpo de la casa -->
  <path d="M13.5 41.2L32 28.9l18.5 12.3V55a2 2 0 0 1-2 2h-33a2 2 0 0 1-2-2z" fill="#fff" stroke="#006973" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- la H -->
  <path d="M25.6 38.6v13.2M38.4 38.6v13.2M25.6 45.2h12.8" stroke="#006973" stroke-width="3.4" stroke-linecap="round" fill="none"/>
</svg>
